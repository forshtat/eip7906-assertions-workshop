name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: yarn
      - run: yarn install --frozen-lockfile
      # typecheck + an offline wiring check (compiles every contract and assertion, tests the frame-tx
      # codec, confirms every script points at a real file). Does not touch the devnet.
      - run: yarn verify
